<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブランド詳細 — Brand Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a href="/" class="site-title">Brand <span>Manager</span></a>
      <nav class="site-nav">
        <a href="/products" class="site-nav__link">商品一覧</a>
        <a href="/bookmarks" class="site-nav__link">ブックマーク</a>
      </nav>
      <div class="header-right">
        <span class="user-name" id="user-name"></span>
        <button class="btn btn-ghost btn-sm" id="logout-btn">ログアウト</button>
      </div>
    </div>
  </header>

  <main class="main-container">
    <a href="/" class="back-link">← ブランド一覧</a>

    <div id="brand-loading">
      <div class="brand-detail-header">
        <div class="skeleton" style="aspect-ratio:4/3;border-radius:10px"></div>
        <div style="padding:4px 0">
          <div class="skeleton" style="height:40px;width:60%;margin-bottom:14px"></div>
          <div class="skeleton" style="height:16px;width:40%;margin-bottom:20px"></div>
          <div class="skeleton" style="height:14px;margin-bottom:8px"></div>
          <div class="skeleton" style="height:14px;width:80%"></div>
        </div>
      </div>
    </div>

    <div id="brand-error" class="empty-state" hidden>
      <div class="empty-state__icon">🔍</div>
      <h2 class="empty-state__title">ブランドが見つかりません</h2>
      <a href="/" class="btn btn-primary" style="margin-top:8px">← ブランド一覧へ</a>
    </div>

    <div id="brand-detail" hidden>
      <div class="brand-detail-header">
        <div class="brand-detail-image" id="detail-image-wrap"></div>
        <div class="brand-detail-info">
          <h1 id="detail-name"></h1>
          <div class="brand-detail-meta" id="detail-meta"></div>
          <div class="tags-row" id="detail-tags"></div>
          <p class="brand-detail-description" id="detail-description"></p>
          <a class="brand-official-link" id="detail-url" target="_blank" rel="noopener noreferrer" hidden>公式サイト ↗</a>
          <div class="brand-detail-actions">
            <button class="btn btn-secondary" id="detail-edit-btn">編集</button>
            <button class="btn btn-danger-ghost" id="detail-delete-btn">削除</button>
          </div>
        </div>
      </div>

      <div class="products-section">
        <div class="products-section-header">
          <h2>商品</h2>
          <span class="last-sync-text" id="last-sync-text"></span>
          <button class="btn btn-secondary btn-sm" id="add-product-btn" style="margin-left:auto">＋ 手動追加</button>
        </div>
        <div id="products-grid" class="products-grid"></div>
        <div id="products-empty" class="empty-state" hidden>
          <div class="empty-state__icon">📦</div>
          <p class="empty-state__title">商品情報がまだありません</p>
          <p class="empty-state__text">毎日6時（UTC）の自動取得後に表示されます。または「手動追加」で登録できます。</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Brand edit modal -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <div class="modal__header">
        <h2 class="modal__title" id="modal-title">ブランドを編集</h2>
        <button class="modal__close" id="modal-close" aria-label="閉じる">×</button>
      </div>
      <div class="modal__body">
        <form id="brand-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="f-url">公式サイトURL</label>
            <div class="url-row">
              <input class="form-input" type="url" id="f-url" placeholder="https://example.com" required>
              <button type="button" class="btn btn-secondary btn-sm" id="fetch-btn">情報を取得</button>
            </div>
            <div class="fetch-status" id="fetch-status"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="f-name">ブランド名</label>
            <input class="form-input" type="text" id="f-name" placeholder="例：Maison Margiela" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="f-description">説明 <span class="opt">（任意）</span></label>
            <textarea class="form-textarea" id="f-description" rows="3"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="f-style">系統</label>
              <input class="form-input" type="text" id="f-style" placeholder="例：ミニマリスト">
            </div>
            <div class="form-group">
              <label class="form-label" for="f-price">価格帯</label>
              <select class="form-select" id="f-price">
                <option value="">—</option>
                <option value="$">$ 低価格</option>
                <option value="$$">$$ ミドル</option>
                <option value="$$$">$$$ プレミアム</option>
                <option value="$$$$">$$$$ ラグジュアリー</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="f-logo">ロゴ / 画像URL <span class="opt">（自動入力）</span></label>
            <input class="form-input" type="url" id="f-logo">
          </div>
          <div class="form-group">
            <label class="form-label" for="f-tags">タグ <span class="opt">（任意・カンマ区切り）</span></label>
            <input class="form-input" type="text" id="f-tags" placeholder="例: アウター, ミニマル">
            <div class="tag-presets" id="tag-presets"></div>
          </div>
          <input type="hidden" id="f-og-image">
        </form>
      </div>
      <div class="modal__footer">
        <button type="button" class="btn btn-secondary" id="modal-cancel">キャンセル</button>
        <button type="button" class="btn btn-primary" id="modal-save">保存</button>
      </div>
    </div>
  </div>

  <!-- Product add modal -->
  <div class="p-modal-overlay" id="p-modal-overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal__header">
        <h2 class="modal__title">商品を追加</h2>
        <button class="modal__close" id="p-modal-close" aria-label="閉じる">×</button>
      </div>
      <div class="modal__body">
        <div class="form-group">
          <label class="form-label" for="p-url">商品URL</label>
          <div class="url-row">
            <input class="form-input" type="url" id="p-url" placeholder="https://...">
            <button type="button" class="btn btn-secondary btn-sm" id="p-fetch-btn">情報を取得</button>
          </div>
          <div class="fetch-status" id="p-fetch-status"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="p-name">商品名</label>
          <input class="form-input" type="text" id="p-name">
        </div>
        <div class="form-group">
          <label class="form-label" for="p-price">価格 <span class="opt">（任意）</span></label>
          <input class="form-input" type="text" id="p-price" placeholder="例: ¥12,000">
        </div>
        <div class="form-group">
          <label class="form-label" for="p-image">画像URL <span class="opt">（自動入力）</span></label>
          <input class="form-input" type="url" id="p-image">
        </div>
        <div class="form-group">
          <label class="form-label" for="p-tags">タグ <span class="opt">（任意・カンマ区切り）</span></label>
          <input class="form-input" type="text" id="p-tags" placeholder="例: アウター, ミニマル">
          <div class="tag-presets" id="p-tag-presets"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="p-notes">メモ <span class="opt">（任意）</span></label>
          <textarea class="form-textarea" id="p-notes" rows="2" placeholder="気になったポイントなど"></textarea>
        </div>
      </div>
      <div class="modal__footer">
        <button type="button" class="btn btn-secondary" id="p-modal-cancel">キャンセル</button>
        <button type="button" class="btn btn-primary" id="p-modal-save">追加</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/modal.js"></script>
  <script src="/js/brand.js"></script>
</body>
</html>
