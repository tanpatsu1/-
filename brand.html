<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Detail — Brand Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a href="/" class="site-title">Brand <span>Manager</span></a>
    </div>
  </header>

  <main class="main-container">
    <a href="/" class="back-link">← All Brands</a>

    <!-- Loading -->
    <div id="brand-loading">
      <div class="brand-detail-header">
        <div class="skeleton" style="aspect-ratio:4/3;border-radius:10px"></div>
        <div style="padding:4px 0">
          <div class="skeleton" style="height:40px;width:60%;margin-bottom:14px"></div>
          <div class="skeleton" style="height:16px;width:40%;margin-bottom:20px"></div>
          <div class="skeleton" style="height:14px;margin-bottom:8px"></div>
          <div class="skeleton" style="height:14px;width:80%;margin-bottom:8px"></div>
          <div class="skeleton" style="height:14px;width:65%"></div>
        </div>
      </div>
    </div>

    <!-- Error -->
    <div id="brand-error" class="empty-state" hidden>
      <div class="empty-state__icon">🔍</div>
      <h2 class="empty-state__title">Brand not found</h2>
      <a href="/" class="btn btn-primary" style="margin-top:8px">← Back to Brands</a>
    </div>

    <!-- Detail -->
    <div id="brand-detail" hidden>
      <div class="brand-detail-header">
        <div class="brand-detail-image" id="detail-image-wrap"></div>
        <div class="brand-detail-info">
          <h1 id="detail-name"></h1>
          <div class="brand-detail-meta" id="detail-meta"></div>
          <p class="brand-detail-description" id="detail-description"></p>
          <a class="brand-official-link" id="detail-url" target="_blank" rel="noopener noreferrer" hidden>
            Official Website ↗
          </a>
          <div class="brand-detail-actions">
            <button class="btn btn-secondary" id="detail-edit-btn">Edit</button>
            <button class="btn btn-danger-ghost" id="detail-delete-btn">Delete</button>
          </div>
        </div>
      </div>

      <div class="products-section">
        <div class="products-section-header">
          <h2>New Products</h2>
          <span class="last-sync-text" id="last-sync-text"></span>
        </div>
        <div id="products-grid" class="products-grid"></div>
        <div id="products-empty" class="empty-state" hidden>
          <div class="empty-state__icon">📦</div>
          <p class="empty-state__title">No products yet</p>
          <p class="empty-state__text">Products appear here after the daily sync (6:00 AM UTC).</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <div class="modal__header">
        <h2 class="modal__title" id="modal-title">Edit Brand</h2>
        <button class="modal__close" id="modal-close" aria-label="Close">×</button>
      </div>
      <div class="modal__body">
        <form id="brand-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="f-url">Official Website URL</label>
            <div class="url-row">
              <input class="form-input" type="url" id="f-url" placeholder="https://example.com" required>
              <button type="button" class="btn btn-secondary btn-sm" id="fetch-btn">Get Info</button>
            </div>
            <div class="fetch-status" id="fetch-status"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="f-name">Brand Name</label>
            <input class="form-input" type="text" id="f-name" placeholder="e.g. Maison Margiela" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="f-description">Description <span class="opt">(optional)</span></label>
            <textarea class="form-textarea" id="f-description" rows="3"></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="f-style">Style</label>
              <input class="form-input" type="text" id="f-style" placeholder="e.g. Minimalist">
            </div>
            <div class="form-group">
              <label class="form-label" for="f-price">Price Range</label>
              <select class="form-select" id="f-price">
                <option value="">—</option>
                <option value="$">$ Budget</option>
                <option value="$$">$$ Mid-range</option>
                <option value="$$$">$$$ Premium</option>
                <option value="$$$$">$$$$ Luxury</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="f-logo">Logo / Image URL <span class="opt">(auto-filled)</span></label>
            <input class="form-input" type="url" id="f-logo">
          </div>
          <input type="hidden" id="f-og-image">
        </form>
      </div>
      <div class="modal__footer">
        <button type="button" class="btn btn-secondary" id="modal-cancel">Cancel</button>
        <button type="button" class="btn btn-primary" id="modal-save">Save Brand</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/modal.js"></script>
  <script src="/js/brand.js"></script>
</body>
</html>
