<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブランド管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a href="/" class="site-title">Brand <span>Manager</span></a>
      <nav class="site-nav">
        <a href="/products" class="site-nav__link">商品一覧</a>
        <a href="/bookmarks" class="site-nav__link">ブックマーク</a>
      </nav>
      <div class="header-right">
        <span class="user-name" id="user-name"></span>
        <button class="btn btn-ghost btn-sm" id="logout-btn">ログアウト</button>
        <button class="btn btn-primary" id="add-brand-btn">＋ ブランドを追加</button>
      </div>
    </div>
  </header>

  <main class="main-container">
    <div class="section-header">
      <h1 class="section-title" id="page-title">ブランド一覧</h1>
      <div class="view-toggle">
        <button class="view-btn is-active" id="view-card" title="カード表示">⊞</button>
        <button class="view-btn" id="view-list" title="リスト表示">☰</button>
      </div>
    </div>
    <div class="search-sort-row">
      <input class="search-input" type="search" id="search-input" placeholder="ブランドを検索…">
      <select class="sort-select" id="sort-select">
        <option value="name">名前順</option>
        <option value="newest">登録が新しい順</option>
        <option value="price_asc">価格帯：低→高</option>
        <option value="price_desc">価格帯：高→低</option>
      </select>
    </div>
    <div class="filter-row" id="filter-row"></div>

    <div id="brands-grid" class="brands-grid"></div>
    <div id="empty-state" class="empty-state" hidden>
      <div class="empty-state__icon">👗</div>
      <h2 class="empty-state__title">ブランドが未登録です</h2>
      <p class="empty-state__text">最初のファッションブランドを追加してコレクションを始めましょう。</p>
      <button class="btn btn-primary" id="empty-add-btn">＋ ブランドを追加</button>
    </div>
  </main>

  <!-- モーダル -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <div class="modal__header">
        <h2 class="modal__title" id="modal-title">ブランドを追加</h2>
        <button class="modal__close" id="modal-close" aria-label="閉じる">×</button>
      </div>
      <div class="modal__body">
        <form id="brand-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="f-url">公式サイトURL</label>
            <div class="url-row">
              <input class="form-input" type="url" id="f-url" placeholder="https://example.com" required>
              <button type="button" class="btn btn-secondary btn-sm" id="fetch-btn">情報を取得</button>
            </div>
            <div class="fetch-status" id="fetch-status"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="f-name">ブランド名</label>
            <input class="form-input" type="text" id="f-name" placeholder="例：Maison Margiela" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="f-description">説明 <span class="opt">（任意）</span></label>
            <textarea class="form-textarea" id="f-description" rows="3" placeholder="ブランドの説明を入力..."></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="f-style">系統</label>
              <input class="form-input" type="text" id="f-style" placeholder="例：ミニマリスト">
            </div>
            <div class="form-group">
              <label class="form-label" for="f-price">価格帯</label>
              <select class="form-select" id="f-price">
                <option value="">—</option>
                <option value="$">$ 低価格</option>
                <option value="$$">$$ ミドル</option>
                <option value="$$$">$$$ プレミアム</option>
                <option value="$$$$">$$$$ ラグジュアリー</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="f-logo">ロゴ / 画像URL <span class="opt">（自動入力）</span></label>
            <input class="form-input" type="url" id="f-logo" placeholder="https://...">
          </div>
          <div class="form-group">
            <label class="form-label" for="f-tags">タグ <span class="opt">（任意・カンマ区切り）</span></label>
            <input class="form-input" type="text" id="f-tags" placeholder="例: アウター, ミニマル">
            <div class="tag-presets" id="tag-presets"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="f-notes">メモ <span class="opt">（任意）</span></label>
            <textarea class="form-textarea" id="f-notes" rows="2" placeholder="セール時期、サイズ感など"></textarea>
          </div>
          <input type="hidden" id="f-og-image">
        </form>
      </div>
      <div class="modal__footer">
        <button type="button" class="btn btn-secondary" id="modal-cancel">キャンセル</button>
        <button type="button" class="btn btn-primary" id="modal-save">保存</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/modal.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
