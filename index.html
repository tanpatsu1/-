<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a href="/" class="site-title">Brand <span>Manager</span></a>
      <button class="btn btn-primary" id="add-brand-btn">+ Add Brand</button>
    </div>
  </header>

  <main class="main-container">
    <div class="section-header">
      <h1 class="section-title" id="page-title">Brands</h1>
    </div>
    <div id="brands-grid" class="brands-grid"></div>
    <div id="empty-state" class="empty-state" hidden>
      <div class="empty-state__icon">👗</div>
      <h2 class="empty-state__title">No brands yet</h2>
      <p class="empty-state__text">Add your first fashion brand to start building your collection.</p>
      <button class="btn btn-primary" id="empty-add-btn">+ Add Brand</button>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <div class="modal__header">
        <h2 class="modal__title" id="modal-title">Add Brand</h2>
        <button class="modal__close" id="modal-close" aria-label="Close">×</button>
      </div>
      <div class="modal__body">
        <form id="brand-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="f-url">Official Website URL</label>
            <div class="url-row">
              <input class="form-input" type="url" id="f-url" placeholder="https://example.com" required>
              <button type="button" class="btn btn-secondary btn-sm" id="fetch-btn">Get Info</button>
            </div>
            <div class="fetch-status" id="fetch-status"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="f-name">Brand Name</label>
            <input class="form-input" type="text" id="f-name" placeholder="e.g. Maison Margiela" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="f-description">Description <span class="opt">(optional)</span></label>
            <textarea class="form-textarea" id="f-description" rows="3" placeholder="Brief brand description..."></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="f-style">Style</label>
              <input class="form-input" type="text" id="f-style" placeholder="e.g. Minimalist">
            </div>
            <div class="form-group">
              <label class="form-label" for="f-price">Price Range</label>
              <select class="form-select" id="f-price">
                <option value="">—</option>
                <option value="$">$ Budget</option>
                <option value="$$">$$ Mid-range</option>
                <option value="$$$">$$$ Premium</option>
                <option value="$$$$">$$$$ Luxury</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="f-logo">Logo / Image URL <span class="opt">(auto-filled)</span></label>
            <input class="form-input" type="url" id="f-logo" placeholder="https://...">
          </div>
          <input type="hidden" id="f-og-image">
        </form>
      </div>
      <div class="modal__footer">
        <button type="button" class="btn btn-secondary" id="modal-cancel">Cancel</button>
        <button type="button" class="btn btn-primary" id="modal-save">Save Brand</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/modal.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
