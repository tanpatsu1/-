<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MISE — パスワードリセット</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="login-page">
  <div class="login-wrap">
    <div class="login-card">
      <h1 class="login-title">MISE <span style="font-family:var(--font);font-weight:300;opacity:0.5;font-size:0.7em">Brand Manager</span></h1>
      <p class="login-subtitle">新しいパスワードを設定してください</p>

      <div id="reset-form">
        <div class="form-group" style="margin-bottom:12px;text-align:left">
          <label class="form-label" for="r-pass">新しいパスワード</label>
          <input class="form-input" type="password" id="r-pass" autocomplete="new-password">
        </div>
        <div class="form-group" style="margin-bottom:16px;text-align:left">
          <label class="form-label" for="r-pass2">パスワード（確認）</label>
          <input class="form-input" type="password" id="r-pass2" autocomplete="new-password">
        </div>
        <button class="btn btn-primary" id="reset-btn" style="width:100%">パスワードを変更する</button>
        <p class="fetch-status" id="reset-status" style="margin-top:12px;text-align:center"></p>
      </div>

      <div id="reset-done" hidden style="text-align:center">
        <p style="color:var(--text-muted);margin-bottom:16px">パスワードを変更しました。</p>
        <a href="/login" class="btn btn-primary">ログインへ</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const status = document.getElementById('reset-status');
      const btn    = document.getElementById('reset-btn');

      btn.addEventListener('click', async () => {
        const pass  = document.getElementById('r-pass').value;
        const pass2 = document.getElementById('r-pass2').value;
        if (pass.length < 6) { status.textContent = 'パスワードは6文字以上にしてください'; status.className = 'fetch-status err'; return; }
        if (pass !== pass2)  { status.textContent = 'パスワードが一致しません';           status.className = 'fetch-status err'; return; }
        btn.disabled = true; btn.textContent = '変更中…';
        try {
          await updatePassword(pass);
          document.getElementById('reset-form').hidden = true;
          document.getElementById('reset-done').hidden = false;
        } catch (err) {
          status.textContent = err.message || '変更に失敗しました';
          status.className = 'fetch-status err';
          btn.disabled = false; btn.textContent = 'パスワードを変更する';
        }
      });
    });
  </script>
</body>
</html>
