<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品一覧 — Brand Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a href="/" class="site-title">Brand <span>Manager</span></a>
      <nav class="site-nav">
        <a href="/products" class="site-nav__link is-active">商品一覧</a>
        <a href="/bookmarks" class="site-nav__link">ブックマーク</a>
      </nav>
      <div class="header-right">
        <span class="user-name" id="user-name"></span>
        <button class="btn btn-ghost btn-sm" id="logout-btn">ログアウト</button>
      </div>
    </div>
  </header>

  <main class="main-container">
    <div class="section-header">
      <h1 class="section-title" id="page-title">商品一覧</h1>
    </div>
    <div class="search-sort-row">
      <input class="search-input" type="search" id="search-input" placeholder="商品名・ブランド・タグで検索…">
      <select class="sort-select" id="sort-select">
        <option value="newest">新しい順</option>
        <option value="oldest">古い順</option>
        <option value="name">名前順</option>
        <option value="brand">ブランド順</option>
      </select>
      <select class="sort-select" id="status-select">
        <option value="">すべてのステータス</option>
        <option value="wishlist">★ ほしい</option>
        <option value="considering">？ 検討中</option>
        <option value="purchased">✓ 購入済み</option>
      </select>
    </div>
    <div class="filter-row" id="filter-row"></div>

    <div id="products-grid" class="products-grid"></div>
    <div id="empty-state" class="empty-state" hidden>
      <div class="empty-state__icon">📦</div>
      <h2 class="empty-state__title">商品がありません</h2>
      <p class="empty-state__text">ブランド詳細ページから商品を手動追加するか、自動取得をお待ちください。</p>
      <a href="/" class="btn btn-primary">ブランド一覧へ</a>
    </div>
  </main>

  <div class="toast-container" id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/products.js"></script>
</body>
</html>
