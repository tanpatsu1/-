<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン — Brand Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="login-page">
  <div class="login-wrap">
    <div class="login-card">
      <h1 class="login-title">Brand <span>Manager</span></h1>

      <div class="login-tabs">
        <button class="login-tab is-active" id="tab-login" type="button">ログイン</button>
        <button class="login-tab" id="tab-signup" type="button">新規登録</button>
      </div>

      <!-- ログイン -->
      <div id="pane-login">
        <div class="form-group" style="margin-bottom:12px;text-align:left">
          <label class="form-label" for="l-email">メールアドレス</label>
          <input class="form-input" type="email" id="l-email" autocomplete="email">
        </div>
        <div class="form-group" style="margin-bottom:16px;text-align:left">
          <label class="form-label" for="l-pass">パスワード</label>
          <input class="form-input" type="password" id="l-pass" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" id="login-btn" style="width:100%">ログイン</button>
        <p class="fetch-status" id="login-status" style="margin-top:12px;text-align:center"></p>
      </div>

      <!-- 新規登録 -->
      <div id="pane-signup" hidden>
        <div class="form-group" style="margin-bottom:12px;text-align:left">
          <label class="form-label" for="s-email">メールアドレス</label>
          <input class="form-input" type="email" id="s-email" autocomplete="email">
        </div>
        <div class="form-group" style="margin-bottom:12px;text-align:left">
          <label class="form-label" for="s-pass">パスワード</label>
          <input class="form-input" type="password" id="s-pass" autocomplete="new-password">
        </div>
        <div class="form-group" style="margin-bottom:16px;text-align:left">
          <label class="form-label" for="s-pass2">パスワード（確認）</label>
          <input class="form-input" type="password" id="s-pass2" autocomplete="new-password">
        </div>
        <button class="btn btn-primary" id="signup-btn" style="width:100%">登録する</button>
        <p class="fetch-status" id="signup-status" style="margin-top:12px;text-align:center"></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await getCurrentUser();
      if (user) { window.location.href = '/'; return; }

      // Tab switching
      const tabLogin  = document.getElementById('tab-login');
      const tabSignup = document.getElementById('tab-signup');
      const paneLogin  = document.getElementById('pane-login');
      const paneSignup = document.getElementById('pane-signup');

      tabLogin.addEventListener('click', () => {
        tabLogin.classList.add('is-active'); tabSignup.classList.remove('is-active');
        paneLogin.hidden = false; paneSignup.hidden = true;
      });
      tabSignup.addEventListener('click', () => {
        tabSignup.classList.add('is-active'); tabLogin.classList.remove('is-active');
        paneSignup.hidden = false; paneLogin.hidden = true;
      });

      // Login
      const loginStatus = document.getElementById('login-status');
      async function doLogin() {
        const email = document.getElementById('l-email').value.trim();
        const pass  = document.getElementById('l-pass').value;
        if (!email || !pass) { loginStatus.textContent = 'メールとパスワードを入力してください'; loginStatus.className = 'fetch-status err'; return; }
        const btn = document.getElementById('login-btn');
        btn.disabled = true; btn.textContent = '確認中…';
        loginStatus.textContent = ''; loginStatus.className = 'fetch-status';
        try {
          await signInWithPassword(email, pass);
          window.location.href = '/';
        } catch (err) {
          loginStatus.textContent = err.message === 'Invalid login credentials' ? 'メールアドレスまたはパスワードが正しくありません' : (err.message || 'ログインに失敗しました');
          loginStatus.className = 'fetch-status err';
          btn.disabled = false; btn.textContent = 'ログイン';
        }
      }
      document.getElementById('login-btn').addEventListener('click', doLogin);
      document.getElementById('l-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

      // Sign-up
      const signupStatus = document.getElementById('signup-status');
      async function doSignup() {
        const email = document.getElementById('s-email').value.trim();
        const pass  = document.getElementById('s-pass').value;
        const pass2 = document.getElementById('s-pass2').value;
        if (!email || !pass) { signupStatus.textContent = 'メールとパスワードを入力してください'; signupStatus.className = 'fetch-status err'; return; }
        if (pass.length < 6) { signupStatus.textContent = 'パスワードは6文字以上にしてください'; signupStatus.className = 'fetch-status err'; return; }
        if (pass !== pass2) { signupStatus.textContent = 'パスワードが一致しません'; signupStatus.className = 'fetch-status err'; return; }
        const btn = document.getElementById('signup-btn');
        btn.disabled = true; btn.textContent = '登録中…';
        signupStatus.textContent = ''; signupStatus.className = 'fetch-status';
        try {
          await signUp(email, pass);
          window.location.href = '/';
        } catch (err) {
          signupStatus.textContent = err.message || '登録に失敗しました';
          signupStatus.className = 'fetch-status err';
          btn.disabled = false; btn.textContent = '登録する';
        }
      }
      document.getElementById('signup-btn').addEventListener('click', doSignup);
      document.getElementById('s-pass2').addEventListener('keydown', e => { if (e.key === 'Enter') doSignup(); });
    });
  </script>
</body>
</html>
