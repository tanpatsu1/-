<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MISE — ログイン</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="login-page">
  <div class="login-wrap">
    <div class="login-card">
      <h1 class="login-title">MISE <span style="font-family:var(--font);font-weight:300;opacity:0.5;font-size:0.7em">Brand Manager</span></h1>

      <div class="login-tabs">
        <button class="login-tab is-active" id="tab-login" type="button">ログイン</button>
        <button class="login-tab" id="tab-signup" type="button">新規登録</button>
      </div>

      <!-- ログイン -->
      <div id="pane-login">
        <div class="form-group" style="margin-bottom:12px;text-align:left">
          <label class="form-label" for="l-email">メールアドレス</label>
          <input class="form-input" type="email" id="l-email" autocomplete="email">
        </div>
        <div class="form-group" style="margin-bottom:16px;text-align:left">
          <label class="form-label" for="l-pass">パスワード</label>
          <input class="form-input" type="password" id="l-pass" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" id="login-btn" style="width:100%">ログイン</button>
        <p class="fetch-status" id="login-status" style="margin-top:12px;text-align:center"></p>
        <p style="text-align:center;margin-top:10px"><button type="button" class="btn-link" id="to-forgot">パスワードをお忘れの方</button></p>
      </div>

      <!-- パスワードリセット -->
      <div id="pane-forgot" hidden>
        <p class="login-subtitle">登録済みのメールアドレスを入力してください</p>
        <div class="form-group" style="margin-bottom:12px;text-align:left">
          <label class="form-label" for="f-email">メールアドレス</label>
          <input class="form-input" type="email" id="f-email" autocomplete="email">
        </div>
        <button class="btn btn-primary" id="forgot-btn" style="width:100%">リセットリンクを送る</button>
        <button class="btn btn-ghost btn-sm" id="forgot-back-btn" style="width:100%;margin-top:8px">← 戻る</button>
        <p class="fetch-status" id="forgot-status" style="margin-top:12px;text-align:center"></p>
      </div>

      <!-- 新規登録 -->
      <div id="pane-signup" hidden>
        <div class="form-group" style="margin-bottom:12px;text-align:left">
          <label class="form-label" for="s-email">メールアドレス</label>
          <input class="form-input" type="email" id="s-email" autocomplete="email">
        </div>
        <div class="form-group" style="margin-bottom:12px;text-align:left">
          <label class="form-label" for="s-pass">パスワード</label>
          <input class="form-input" type="password" id="s-pass" autocomplete="new-password">
        </div>
        <div class="form-group" style="margin-bottom:16px;text-align:left">
          <label class="form-label" for="s-pass2">パスワード（確認）</label>
          <input class="form-input" type="password" id="s-pass2" autocomplete="new-password">
        </div>
        <button class="btn btn-primary" id="signup-btn" style="width:100%">登録する</button>
        <p class="fetch-status" id="signup-status" style="margin-top:12px;text-align:center"></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await getCurrentUser();
      if (user) { window.location.href = '/'; return; }

      // Tab switching
      const tabLogin  = document.getElementById('tab-login');
      const tabSignup = document.getElementById('tab-signup');
      const paneLogin  = document.getElementById('pane-login');
      const paneSignup = document.getElementById('pane-signup');

      tabLogin.addEventListener('click', () => {
        tabLogin.classList.add('is-active'); tabSignup.classList.remove('is-active');
        paneLogin.hidden = false; paneSignup.hidden = true;
      });
      tabSignup.addEventListener('click', () => {
        tabSignup.classList.add('is-active'); tabLogin.classList.remove('is-active');
        paneSignup.hidden = false; paneLogin.hidden = true;
      });

      // Login
      const loginStatus = document.getElementById('login-status');
      async function doLogin() {
        const email = document.getElementById('l-email').value.trim();
        const pass  = document.getElementById('l-pass').value;
        if (!email || !pass) { loginStatus.textContent = 'メールとパスワードを入力してください'; loginStatus.className = 'fetch-status err'; return; }
        const btn = document.getElementById('login-btn');
        btn.disabled = true; btn.textContent = '確認中…';
        loginStatus.textContent = ''; loginStatus.className = 'fetch-status';
        try {
          await signInWithPassword(email, pass);
          window.location.href = '/';
        } catch (err) {
          loginStatus.textContent = err.message === 'Invalid login credentials' ? 'メールアドレスまたはパスワードが正しくありません' : (err.message || 'ログインに失敗しました');
          loginStatus.className = 'fetch-status err';
          btn.disabled = false; btn.textContent = 'ログイン';
        }
      }
      document.getElementById('login-btn').addEventListener('click', doLogin);
      document.getElementById('l-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

      // Sign-up
      const signupStatus = document.getElementById('signup-status');
      async function doSignup() {
        const email = document.getElementById('s-email').value.trim();
        const pass  = document.getElementById('s-pass').value;
        const pass2 = document.getElementById('s-pass2').value;
        if (!email || !pass) { signupStatus.textContent = 'メールとパスワードを入力してください'; signupStatus.className = 'fetch-status err'; return; }
        if (pass.length < 6) { signupStatus.textContent = 'パスワードは6文字以上にしてください'; signupStatus.className = 'fetch-status err'; return; }
        if (pass !== pass2) { signupStatus.textContent = 'パスワードが一致しません'; signupStatus.className = 'fetch-status err'; return; }
        const btn = document.getElementById('signup-btn');
        btn.disabled = true; btn.textContent = '登録中…';
        signupStatus.textContent = ''; signupStatus.className = 'fetch-status';
        try {
          await signUp(email, pass);
          window.location.href = '/';
        } catch (err) {
          signupStatus.textContent = err.message || '登録に失敗しました';
          signupStatus.className = 'fetch-status err';
          btn.disabled = false; btn.textContent = '登録する';
        }
      }
      document.getElementById('signup-btn').addEventListener('click', doSignup);
      document.getElementById('s-pass2').addEventListener('keydown', e => { if (e.key === 'Enter') doSignup(); });

      // Forgot password
      function showForgot() {
        [paneLogin, paneSignup].forEach(p => p.hidden = true);
        document.getElementById('pane-forgot').hidden = false;
        [tabLogin, tabSignup].forEach(t => t.classList.remove('is-active'));
      }
      document.getElementById('forgot-back-btn').addEventListener('click', () => {
        document.getElementById('pane-forgot').hidden = true;
        paneLogin.hidden = false; tabLogin.classList.add('is-active');
      });
      const forgotStatus = document.getElementById('forgot-status');
      document.getElementById('forgot-btn').addEventListener('click', async () => {
        const email = document.getElementById('f-email').value.trim();
        if (!email) { forgotStatus.textContent = 'メールアドレスを入力してください'; forgotStatus.className = 'fetch-status err'; return; }
        const btn = document.getElementById('forgot-btn');
        btn.disabled = true; btn.textContent = '送信中…';
        try {
          await resetPasswordForEmail(email);
          forgotStatus.textContent = 'リセットリンクを送りました。メールを確認してください。';
          forgotStatus.className = 'fetch-status ok';
        } catch (err) {
          forgotStatus.textContent = err.message || '送信に失敗しました';
          forgotStatus.className = 'fetch-status err';
          btn.disabled = false; btn.textContent = 'リセットリンクを送る';
        }
      });

      // "パスワードをお忘れの方" link under login form
      document.getElementById('to-forgot')?.addEventListener('click', showForgot);
    });
  </script>
</body>
</html>
