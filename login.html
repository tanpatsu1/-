<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン — Brand Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="login-page">
  <div class="login-wrap">
    <div class="login-card">
      <h1 class="login-title">Brand <span>Manager</span></h1>
      <p class="login-subtitle">メールアドレスにログインリンクを送ります</p>

      <div id="login-form">
        <div class="form-group" style="margin-bottom:12px">
          <label class="form-label" for="login-email">メールアドレス</label>
          <input class="form-input" type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
        </div>
        <button class="btn btn-primary" id="login-btn" style="width:100%">ログインリンクを送る</button>
        <p class="fetch-status" id="login-status" style="margin-top:12px;text-align:center"></p>
      </div>

      <div id="login-sent" hidden style="text-align:center">
        <div style="font-size:2.5rem;margin-bottom:12px">📬</div>
        <p style="color:var(--text-muted);line-height:1.6">メールを送信しました。<br>届いたリンクをクリックしてください。</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await getCurrentUser();
      if (user) { window.location.href = '/'; return; }

      const btn    = document.getElementById('login-btn');
      const status = document.getElementById('login-status');

      async function submit() {
        const email = document.getElementById('login-email').value.trim();
        if (!email) {
          status.textContent = 'メールアドレスを入力してください';
          status.className = 'fetch-status err';
          return;
        }
        btn.disabled = true;
        btn.textContent = '送信中…';
        status.textContent = '';
        status.className = 'fetch-status';

        const ok = await sendMagicLink(email);
        if (ok) {
          document.getElementById('login-form').hidden = true;
          document.getElementById('login-sent').hidden = false;
        } else {
          status.textContent = '送信に失敗しました。もう一度お試しください';
          status.className = 'fetch-status err';
          btn.disabled = false;
          btn.textContent = 'ログインリンクを送る';
        }
      }

      btn.addEventListener('click', submit);
      document.getElementById('login-email').addEventListener('keydown', e => {
        if (e.key === 'Enter') submit();
      });
    });
  </script>
</body>
</html>
